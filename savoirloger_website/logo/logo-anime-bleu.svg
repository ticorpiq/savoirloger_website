<style>
.mur,.plancher,.sourire{stroke-dasharray:1;stroke-dashoffset:1}
.mur{animation:trace 1s .1s cubic-bezier(.65,0,.35,1) forwards}
.plancher{animation:trace .35s .9s ease-out forwards}
.toit{opacity:0;transform:translateY(-30px);animation:tombe .55s .95s cubic-bezier(.3,1.5,.5,1) forwards}
.oeil{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop .3s 1.35s cubic-bezier(.3,1.8,.5,1) forwards}
.oeil.d{animation:pop .3s 1.45s cubic-bezier(.3,1.8,.5,1) forwards,clin 4.5s 3s ease-in-out infinite}
.sourire{animation:trace .4s 1.6s ease-out forwards}
.mot{opacity:0;transform:translateY(14px);animation:monte .6s .5s cubic-bezier(.22,1,.36,1) forwards}
@keyframes trace{to{stroke-dashoffset:0}}@keyframes tombe{to{opacity:1;transform:none}}@keyframes pop{to{transform:scale(1)}}
@keyframes clin{0%,92%,100%{transform:scale(1)}95%{transform:scale(1,.12)}}@keyframes monte{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}}
</style>
